# Main configuration script for the SpaceNet Mininet Simulator
# ~~~ Main Settings ~~~
ConstellationName: starlink2000_10_10 # Name must match constellation config file (fakelink6_10_2, onefib66_30_18, starlink72_1_10, starlink72_30_29)
OutputFilePath: script_output/runtime_test/
DeleteAppResults: False
Verbose: True
Optimize: True
MonitorResource: False
SimTimeMode: continuous
# ~~~ App configurations ~~~
AppName: Ping # Options- Ping, iPerf, CLI
# For Ping and iPerf
# Useable keywords- firstGS, lastGS, firstSat, lastSat
SourceDeviceName: firstGS #, 501, 1001, 2001  #Orlando
DestDeviceName: lastGS #, 500, 1000, 2000  #Delhi
PauseAtIntervalChange: True # Will pause app while network links and routes are updated, then resume
# For CLI
CLIStartInterval: 0
CLIIntervalCount: 3
