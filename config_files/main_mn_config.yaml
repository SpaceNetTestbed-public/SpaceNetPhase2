# Main configuration script for the SpaceNet Mininet Simulator
# ~~~ Main Settings ~~~
ConstellationName: starlink_alt500_inc75_7pm_london # Name must match constellation config file (fakelink6_10_2, onefib66_30_18, starlink72_1_10, starlink72_30_29)
OutputFilePath: script_output/
DeleteAppResults: False
Verbose: True
Optimize: True
MonitorResource: False
# ~~~ App configurations ~~~
AppName: Ping # Options- Ping, iPerf, CLI
# For Ping and iPerf
# Useable keywords- firstGS, lastGS, firstSat, lastSat
SourceDeviceName: 1008 #1609 # 101, 501, 1001, 2001
DestDeviceName: 1010 #1585 # 100, 500, 1000, 2000
PauseAtIntervalChange: True # Will pause app while network links and routes are updated, then resume
# For CLI
CLIStartInterval: 0
CLIIntervalCount: 3
