# Main configuration script for the SpaceNet Mininet Simulator
# ~~~ Main Settings ~~~
ConstellationName: starlink1584_10_10 # Name must match constellation config file (fakelink6_10_2, onefib66_30_18, starlink72_1_10, starlink72_30_29)
OutputFilePath: script_output/
DeleteAppResults: False
Verbose: True
Optimize: True
MonitorResource: False
# ~~~ App configurations ~~~
AppName: Ping # Options- Ping, iPerf, CLI
# For Ping and iPerf
# Useable keywords- firstGS, lastGS, firstSat, lastSat
SourceDeviceName: 1586 #1609 # 101, 501, 1001, 2001
DestDeviceName: 1584 #1585 # 100, 500, 1000, 2000
# For CLI
CLIStartInterval: 0
CLIIntervalCount: 10
