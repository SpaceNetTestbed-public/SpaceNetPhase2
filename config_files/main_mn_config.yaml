# Main configuration script for the SpaceNet Mininet Simulator
# ~~~ Main Settings ~~~
ConstellationName: fakelink6_10_2 # Name must match constellation config file (fakelink6_10_2, onefib66_30_18, starlink72_1_10, starlink72_30_29)
OutputFilePath: script_output/
DeleteAppResults: False
Verbose: True
Optimize: True
# ~~~ App configurations ~~~
AppName: Ping # Options- Ping, iPerf, CLI
# For Ping and iPerf
# Useable keywords- firstGS, lastGS, firstSat, lastSat
SourceDeviceName: firstGS
DestDeviceName: lastGS
# For CLI
CLIStartInterval: 0
CLIIntervalCount: 0
