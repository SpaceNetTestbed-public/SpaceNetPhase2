constellation:
    operator: starlink
    number_of_shells: 1
    shell1:
        name: shell1
        orbits: 72
        sat_per_orbit: 22
        altitude: 550
        elevation_angle: 25
        inclination: 53
    topology:
        association_criteria_GSL: BASED_ON_DISTANCE_ONLY_MININET
        ISL: grid
    routing:
        algorithm: static_latency
        ip_range: 12.0.0.0
        interDomain_routing: 1
        border_gateway: gs0
        other_constellation_ip_range: 11.0.0.0

ground_stations:
    gs_file: ../mobility/ground_stations_small.txt

simulation:
    start_time: 2022,10,18,1,1,13
    length: 10
    step: 1
    debug: 1

application:
    type: ping
    source: gs0
    destination: gs22
    duration: 30
    congestion_control: cubic
    result_out: ../results/starlink/ping_27Oct
    background_traffic: no
    tcpdump: no

data_n_results:
    connectivity_matrix: ../utils/connectivity_matrix/starlink/
    routing: ../utils/routing/starlink/
    simulation_results: ../results/starlink
