constellation:
    operator: oneweb
    number_of_shells: 1
    shell1:
        name: shell1
        orbits: 12
        sat_per_orbit: 49
        altitude: 1200
        elevation_angle: 45
        inclination: 87
    topology:
        association_criteria_GSL: BASED_ON_DISTANCE_ONLY_MININET
        ISL: grid
    routing:
        algorithm: static_hop_count
        ip_range: 11.0.0.0
        interDomain_routing: 1
        border_gateway: gs1
        other_constellation_ip_range: 12.0.0.0

ground_stations:
    gs_file: ../mobility/ground_stations_small.txt

simulation:
    start_time: 2022,10,18,1,1,13
    length: 10
    step: 1
    debug: 1

application:
    type: ping
    source: gs0
    destination: gs21
    duration: 30
    congestion_control: cubic
    result_out: ping_OneWeb_28-1Oct
    background_traffic: no
    tcpdump: no

data_n_results:
    connectivity_matrix: ../utils/connectivity_matrix/oneweb/
    routing: ../utils/routing/oneweb/
    simulation_results: ../results_oneweb
